<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./assets/images/icon-.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Calculadora 🚀🤖</title>
  </head>
  <body>
    <section class="section-init">
      <h2 class="section-title">Calculadora</h2>
    </section>

    <section class="section-calculator">
      <div class="calculator">
        <div class="screen">
          <div class="operation"></div>
          <div class="operation-result"></div>
        </div>
        <div class="btn-clear btn">C</div>
        <div class="btn-delete btn">X</div>
        <div class="btn-1 btn">1</div>
        <div class="btn-2 btn">2</div>
        <div class="btn-3 btn">3</div>
        <div class="btn-plus btn">&#43</div>
        <div class="btn-4 btn">4</div>
        <div class="btn-5 btn">5</div>
        <div class="btn-6 btn">6</div>
        <div class="btn-minus btn">&#45</div>
        <div class="btn-7 btn">7</div>
        <div class="btn-8 btn">8</div>
        <div class="btn-9 btn">9</div>
        <div class="btn-mult btn">&#42</div>
        <div class="btn-decimal btn">.</div>
        <div class="btn-0 btn">0</div>
        <div class="btn-divide btn">&#47</div>
        <div class="btn-result btn">&#61</div>
      </div>
    </section>

    <div class="mouse-follower"></div>

    <script src="scripts/script.js"></script>
    <script src="scripts/mouse-follower.js"></script>
  </body>
</html>
